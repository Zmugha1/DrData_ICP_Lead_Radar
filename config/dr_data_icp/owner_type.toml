  { text = "FOREST COUNTY POTAWATOMI" },
  { text = "HO CHUNK" },
  { text = "ONEIDA TRIBE" },
]

[[classes]]
type_key = "government"
phrases = [
  { text = "CITY OF", anchor = "anywhere" },
  { text = "VILLAGE OF", anchor = "anywhere" },
  { text = "TOWN OF", anchor = "anywhere" },
  { text = "COUNTY OF", anchor = "anywhere" },
  { text = "STATE OF", anchor = "anywhere" },
  { text = "UNITED STATES", anchor = "anywhere" },
  { text = "COUNTY", anchor = "anywhere", not_followed_by = ["ROAD", "RD", "LINE", "TRUNK", "HIGHWAY", "TRL", "TRAIL"] },
  { text = "HOUSING AUTHORITY", anchor = "anywhere" },
  { text = "HOUSING AUTH", anchor = "anywhere" },
  { text = "SCHOOL DISTRICT", anchor = "anywhere" },
  { text = "SANITARY DISTRICT", anchor = "anywhere" },
  { text = "WISCONSIN DNR", anchor = "anywhere" },
  { text = "DNR", anchor = "anywhere" },
  { text = "DEPARTMENT OF", anchor = "anywhere" },
  { text = "DEPT OF", anchor = "anywhere" },
  { text = "MUNICIPAL", anchor = "anywhere" },
  { text = "REDEV AUTH", anchor = "anywhere" },
  { text = "REDEVELOPMENT AUTHORITY", anchor = "anywhere" },
]

