# Owner-type classification for query-time reads.
# Fetch still writes owner_type from the hardcoded rule in parcels.rs.
#
# Precedence: first matching type in `precedence` wins.
# placeholder is first: a marker in the name field is not a party.
# nonprofit then tribal sit ahead of government so a charity or a
# tribal nation with COUNTY in the name is not read as the county.
# government then trust then entity. Remainder is individual.
#
# Each phrase has an anchor: first (leading tokens), final (trailing
# tokens), or anywhere (default).
#
# COUNTY also has not_followed_by: the next token must not be a road
# word. HWY is not in that list because WAUKESHA COUNTY (HWY DEPT) is
# a public body and would be excluded.

precedence = ["placeholder", "nonprofit", "tribal", "government", "trust", "entity"]
exclude_from_groups_default = ["government", "placeholder", "tribal"]

[[classes]]
type_key = "placeholder"
phrases = [
  { text = "INCOMPLETE TAXROLL INFORMATION", anchor = "anywhere" },
]

[[classes]]
type_key = "nonprofit"
phrases = [
  { text = "HABITAT FOR HUMANITY" },
  { text = "SALVATION ARMY" },
  { text = "GOODWILL INDUSTRIES" },
  { text = "UNITED WAY" },
  { text = "ST VINCENT" },
  { text = "CHRISTIAN ASSOC" },
  { text = "ARCHDIOCESE" },
  { text = "CONSERVANCY" },
  { text = "CONGREGATION" },
  { text = "SYNAGOGUE" },
  { text = "MINISTRIES" },
  { text = "PRESBYTERIAN" },
  { text = "METHODIST" },
  { text = "LUTHERAN" },
  { text = "CATHOLIC" },
  { text = "BAPTIST" },
  { text = "DIOCESE" },
  { text = "FOUNDATION" },
  { text = "CHURCH" },
  { text = "YMCA" },
]

[[classes]]
type_key = "tribal"
