# Stored templates for a later human or assisted search session.
# Placeholders stay literal. These queries are not executed by this
# repo, by Cursor, or by any automatic job.

[[categories]]
key = "estimating_bottleneck_live"
vertical_keys = ["custom_homebuilder", "specialty_trade"]
queries = [
    "estimator job openings [county] construction 2026",
    "\"hiring estimator\" OR \"seeking estimator\" [metro] contractor",
    "preconstruction manager job [state] residential builder",
]

[[categories]]
key = "succession_and_encoded_knowledge"
vertical_keys = [
    "custom_homebuilder",
    "specialty_trade",
    "landscape_design_build",
    "restoration",
    "manufacturer_custom_fabricator",
]
