spine_source_id = "src-milwaukee-parcels"
county_fips = "55079"
natural_key_field = "taxkey"
has_stable_key = true
# Profiled 2 September 2026, checked in full on 3 September 2026:
# 280,674 rows, 349 two-row TAXKEY groups. Those pairs were RecSource
# MCTREAS vs MPROP, not stacked geometry. Collapsing them then would
# have destroyed 349 real records, so the rule stayed off.
# Re-verified 19 September 2026: at least one cross-muni pair remains
# (TAXKEY 2190027000 is Milwaukee MCD 53000 and Wauwatosa 84675).
# Collapse stays off. Identical same-muni stacks are dropped below
# by OBJECTID, not by collapsing every taxkey.
collapse_duplicate_geometry = false
# No Fallback layer. V24 requires spine_coverage_fallback_threshold
# to be absent when none exists.
attachments = []

# Municipality names are on the parcel layer (MUNINAME beside MCD).
# There is no separate Milwaukee civil-divisions service.
[lookup_source]
kind = "Derived"
code_field = "MCD"
name_field = "MUNINAME"

[[layers]]
role = "Primary"
url = "https://services2.arcgis.com/s1wgJQKbKJihhhaT/arcgis/rest/services/Milwaukee_County_Parcels_Property_Information_view/FeatureServer/58"
# 18–19 September 2026 live FeatureServer/58: mapped names are still
# TAXKEY, MCD, OWNERNAME1, ADDRESS, OWNERADDR, Code, RecSource
# (lookup MCD, MUNINAME). Not a rename. schemaLastEditDate 2026-09-15.
# Unfiltered 281,207. TAXKEY IS NULL on 544 rows, TAXKEY='' on 2.
# Those rows are fetched and skipped as unknown non-keys.
# Same-muni identical stacks, keep lowest OBJECTID: 3550699100 keep
# 118682 drop 118683 and 118684; 3501264000 keep 119224 drop 119227.
where_clause = "1=1 AND OBJECTID NOT IN (118683, 118684, 119227)"
# vintage_field is absent. The layer has no Export_Date. Lag cannot
# be measured from the data.

[layers.field_map]
# Verified 18 September 2026 against the live layer fields array.
# None of these names changed. PARCEL_KEY exists but is null on
# 148,618 rows and is not a substitute for TAXKEY.
taxkey = "TAXKEY"
muni_code = "MCD"
owner_name = "OWNERNAME1"
site_address = "ADDRESS"
mail_address_1 = "OWNERADDR"
prop_class = "Code"
rec_source = "RecSource"

[[layers]]
role = "ValueSource"
url = "https://lio.milwaukeecountywi.gov/arcgis/rest/services/PropertyInfo/Parcels_w_Officials/FeatureServer/0"
where_clause = "1=1"
# This layer is scheduled for retirement. It is the only public
# source of Milwaukee assessed values. When it goes, the value
# columns become null county-wide.
# Confirmed 2 September 2026 on the live definition: value fields
# are AssessedValue, ImpValue, LandValue. The join key is Taxkey
# (not TAXKEY). Owner is Owner_1 (not OWNERNAME1).

[layers.field_map]
taxkey = "Taxkey"
muni_code = "MCD"
owner_name = "Owner_1"
assessed_value = "AssessedValue"
improvement_value = "ImpValue"
land_value = "LandValue"
