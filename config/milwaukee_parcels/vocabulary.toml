# Last five terms come from a real conversation. The pattern is
# agreement without authority: enthusiasm from someone who cannot
# sign. "there is a gap" counts only when it is unaccompanied by a
# number, which is a judgment a term match cannot make, so the term
# flags for review rather than deciding anything.
