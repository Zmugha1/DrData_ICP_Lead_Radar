requires_key = false
notes = "profiled 3 September 2026 across fourteen Waukesha municipalities. Six distinct portal systems with a working public listing and no constructible document URL, so a packet must be discovered from a listing page rather than fetched by date. Item shape varies: Village of Pewaukee carries applicant, owner, parcel key, acreage and zoning; Brookfield carries a tax key and an applicant only; Waukesha City and New Berlin carry no parcel key at all. Parcel keys resolved at 18 of 45 after the residential filter was removed, and punctuation stripping would reach 31. This is the earliest signal available, twelve to twenty-four months ahead of a permit, and the most expensive to build."

