[package]
name = "radar-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "radar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
radar-config = { path = "../../../crates/radar-config" }
radar-store = { path = "../../../crates/radar-store" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[[bin]]
name = "radar-desktop"
path = "src/main.rs"
